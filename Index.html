<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hairpin Bend Manual Driving Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h2 {
      color: #ffeb3b;
      font-size: 18px;
      margin: 4px 0;
    }
    p {
      color: #bbb;
      font-size: 12px;
      margin: 0 0 8px 0;
    }
    #simCanvas {
      background-color: #2b1810;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.7);
      max-width: 100%;
      height: auto;
    }
    .controller-panel {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      max-width: 440px;
      margin: 10px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls-grid {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      margin-bottom: 10px;
    }
    .car-box {
      flex: 1;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 8px;
    }
    .btn-drive {
      width: 100%;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      touch-action: manipulation;
    }
    .btn-c1 {
      background: #00bcd4;
    }
    .btn-c1:active {
      background: #00838f;
    }
    .btn-c2 {
      background: #ff9800;
    }
    .btn-c2:active {
      background: #e65100;
    }
    input[type=range] {
      width: 100%;
      margin-top: 8px;
      height: 6px;
    }
    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn-reset {
      background: #f44336;
      padding: 8px 24px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      margin-top: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>

  <h2>पहाड़ी U-टर्न (Hairpin Bend) ड्राइविंग सिमुलेशन</h2>
  <p>बटन को दबाकर रखें (Hold karein) car ko aage chalane ke liye</p>

  <canvas id="simCanvas" width="460" height="620"></canvas>

  <div class="controller-panel">
    <div class="controls-grid">
      <!-- Car A Control -->
      <div class="car-box">
        <button class="btn-drive btn-c1" id="btnDriveA">🚗 Drive Car A<br><small>(Daba kar rakhein)</small></button>
        <input type="range" id="sliderA" min="0" max="100" value="0">
      </div>

      <!-- Car B Control -->
      <div class="car-box">
        <button class="btn-drive btn-c2" id="btnDriveB">🚗 Drive Car B<br><small>(Daba kar rakhein)</small></button>
        <input type="range" id="sliderB" min="0" max="100" value="0">
      </div>
    </div>

    <div class="action-row">
      <button class="btn-reset" onclick="resetAll()">Reset (Shuru Se)</button>
    </div>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:#00e676;"></span>Green Light: Road Clear</div>
    <div><span class="dot" style="background:#ff1744;"></span>Red Light + Horn: Danger Ahead</div>
  </div>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    const sliderA = document.getElementById("sliderA");
    const sliderB = document.getElementById("sliderB");
    const btnA = document.getElementById("btnDriveA");
    const btnB = document.getElementById("btnDriveB");

    let driveAActive = false;
    let driveBActive = false;

    // Road Dimensions
    const centerX = 230;
    const centerY = 230;
    const outerR = 175;
    const innerR = 55;
    const laneA_R = 135; // Center of Left Outer Lane
    const laneB_R = 95;  // Center of Right Inner Lane
    const straightHeight = 390;

    // Web Audio API for Real Buzzer/Horn
    let audioCtx = null;
    let osc = null;
    let gainNode = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function soundAlert(play) {
      if (play) {
        initAudio();
        if (!osc && audioCtx) {
          osc = audioCtx.createOscillator();
          gainNode = audioCtx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(750, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc.start();
        }
      } else {
        if (osc) {
          try { osc.stop(); osc.disconnect(); } catch(e){}
          osc = null;
        }
      }
    }

    // Lane Positioning Calculations
    function getCarCoords(percent, isLeftCar) {
      const p = percent / 100;
      let x, y, angle;

      if (isLeftCar) {
        // Car A: Bottom-left (x=95) -> Up -> Curve -> Down (x=365)
        const r = laneA_R;
        const total = (straightHeight * 2) + (Math.PI * r);
        const curr = p * total;

        if (curr <= straightHeight) {
          x = centerX - r;
          y = 620 - curr;
          angle = -Math.PI / 2;
        } else if (curr <= straightHeight + (Math.PI * r)) {
          const arcD = curr - straightHeight;
          const theta = Math.PI - (arcD / r);
          x = centerX + r * Math.cos(theta);
          y = centerY - r * Math.sin(theta);
          angle = -theta + Math.PI;
        } else {
          const rem = curr - (straightHeight + (Math.PI * r));
          x = centerX + r;
          y = centerY + rem;
          angle = Math.PI / 2;
        }
      } else {
        // Car B: Bottom-right (x=325) -> Up -> Curve -> Down (x=135)
        const r = laneB_R;
        const total = (straightHeight * 2) + (Math.PI * r);
        const curr = p * total;

        if (curr <= straightHeight) {
          x = centerX + r;
          y = 620 - curr;
          angle = -Math.PI / 2;
        } else if (curr <= straightHeight + (Math.PI * r)) {
          const arcD = curr - straightHeight;
          const theta = arcD / r;
          x = centerX + r * Math.cos(theta);
          y = centerY - r * Math.sin(theta);
          angle = -theta;
        } else {
          const rem = curr - (straightHeight + (Math.PI * r));
          x = centerX - r;
          y = centerY + rem;
          angle = Math.PI / 2;
        }
      }
      return { x, y, angle };
    }

    function drawSignalLight(x, y, isRed) {
      // Stand
      ctx.fillStyle = "#222";
      ctx.fillRect(x - 3, y - 10, 6, 40);

      // Housing Box
      ctx.fillStyle = "#111";
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - 14, y - 55, 28, 50, 6);
      ctx.fill();
      ctx.stroke();

      // Red Bulb
      ctx.beginPath();
      ctx.arc(x, y - 42, 8, 0, Math.PI * 2);
      ctx.fillStyle = isRed ? "#ff1744" : "#450000";
      if (isRed) {
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 15;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      // Green Bulb
      ctx.beginPath();
      ctx.arc(x, y - 20, 8, 0, Math.PI * 2);
      ctx.fillStyle = !isRed ? "#00e676" : "#003a15";
      if (!isRed) {
        ctx.shadowColor = "#00e676";
        ctx.shadowBlur = 12;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Mud Terrain
      ctx.fillStyle = "#331a0e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Mountains
      ctx.fillStyle = "#4a2815";
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(60, 0); ctx.lineTo(40, 240); ctx.lineTo(0, 500); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(460, 0); ctx.lineTo(400, 0); ctx.lineTo(420, 240); ctx.lineTo(460, 500); ctx.fill();

      // Center Hill Divider
      ctx.fillStyle = "#3d1f10";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerR, Math.PI, 0, false);
      ctx.lineTo(centerX + innerR, 620);
      ctx.lineTo(centerX - innerR, 620);
      ctx.closePath();
      ctx.fill();

      // Main Road
      ctx.fillStyle = "#1c1c1c";
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerR, Math.PI, 0, false);
      ctx.lineTo(centerX + outerR, 620);
      ctx.lineTo(centerX - outerR, 620);
      ctx.closePath();
      ctx.fill();

      // Cut inner hill out
      ctx.fillStyle = "#3d1f10";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerR, Math.PI, 0, false);
      ctx.lineTo(centerX + innerR, 620);
      ctx.lineTo(centerX - innerR, 620);
      ctx.closePath();
      ctx.fill();

      // Outer Zebra Borders
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerR, Math.PI, 0, false);
      ctx.lineTo(centerX + outerR, 620);
      ctx.moveTo(centerX - outerR, centerY);
      ctx.lineTo(centerX - outerR, 620);
      ctx.stroke();

      ctx.strokeStyle = "#000000";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerR + 2, Math.PI, 0, false);
      ctx.lineTo(centerX + innerR + 2, 620);
      ctx.moveTo(centerX - innerR - 2, centerY);
      ctx.lineTo(centerX - innerR - 2, 620);
      ctx.stroke();
      ctx.setLineDash([]);

      // Lane Divider Dashes
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([16, 14]);
      const midR = (outerR + innerR) / 2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, midR, Math.PI, 0, false);
      ctx.moveTo(centerX - midR, centerY);
      ctx.lineTo(centerX - midR, 620);
      ctx.moveTo(centerX + midR, centerY);
      ctx.lineTo(centerX + midR, 620);
      ctx.stroke();
      ctx.setLineDash([]);

      // 9V Battery Packs at bottom left
      for (let i = 0; i < 3; i++) {
        const bx = 78 + (i * 24), by = 550;
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(bx, by, 18, 30);
        ctx.fillStyle = "#eee";
        ctx.fillRect(bx + 2, by - 3, 4, 3);
        ctx.fillRect(bx + 11, by - 3, 4, 3);
        ctx.fillStyle = "#fff";
        ctx.font = "7px sans-serif";
        ctx.fillText("HYW", bx + 1, by + 14);
      }

      // Smooth Increment when buttons are held
      if (driveAActive) {
        sliderA.value = (parseFloat(sliderA.value) + 0.45) % 100;
      }
      if (driveBActive) {
        sliderB.value = (parseFloat(sliderB.value) + 0.45) % 100;
      }

      // Positions
      const posA = getCarCoords(sliderA.value, true);
      const posB = getCarCoords(sliderB.value, false);

      // Car A (Cyan Blue)
      ctx.save();
      ctx.translate(posA.x, posA.y);
      ctx.rotate(posA.angle);
      ctx.fillStyle = "#00bcd4";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-8, -11, 16, 6);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-8, -19, 4, 2);
      ctx.fillRect(4, -19, 4, 2);
      ctx.restore();

      // Car B (Orange)
      ctx.save();
      ctx.translate(posB.x, posB.y);
      ctx.rotate(posB.angle);
      ctx.fillStyle = "#ff9800";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-8, -11, 16, 6);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-8, -19, 4, 2);
      ctx.fillRect(4, -19, 4, 2);
      ctx.restore();

      // Danger Logic (Both vehicles in or approaching apex curve 35% to 75%)
      const vA = parseFloat(sliderA.value);
      const vB = parseFloat(sliderB.value);
      const danger = (vA >= 35 && vA <= 75) && (vB >= 35 && vB <= 75);

      soundAlert(danger);

      // Side Signal Lights
      drawSignalLight(32, 260, danger);
      drawSignalLight(428, 260, danger);

      if (danger) {
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("🚨 RED ALERT: HORN ACTIVE! 🚨", centerX, 35);
      }

      requestAnimationFrame(render);
    }

    // Event Listeners for Touch and Mouse Hold
    function bindDriveEvents(btn, setActive) {
      btn.addEventListener("mousedown", (e) => { e.preventDefault(); initAudio(); setActive(true); });
      window.addEventListener("mouseup", () => setActive(false));
      btn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); setActive(true); }, {passive: false});
      window.addEventListener("touchend", () => setActive(false));
    }

    bindDriveEvents(btnA, (v) => driveAActive = v);
    bindDriveEvents(btnB, (v) => driveBActive = v);

    function resetAll() {
      sliderA.value = 0;
      sliderB.value = 0;
      driveAActive = false;
      driveBActive = false;
      soundAlert(false);
    }

    // Run render loop
    requestAnimationFrame(render);
  </script>
</body>
</html>
