<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hairpin Bend Manual Car Control Simulation</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h2 {
      color: #ffeb3b;
      font-size: 19px;
      margin: 5px 0;
    }
    p {
      color: #bbb;
      font-size: 13px;
      margin: 0 0 10px 0;
    }
    #simCanvas {
      background-color: #2b1810;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.7);
      max-width: 100%;
      height: auto;
    }
    .controller-box {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      max-width: 440px;
      margin: 12px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 14px;
      font-weight: bold;
    }
    input[type=range] {
      flex: 1;
      margin: 0 12px;
      height: 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .c1-label { color: #00e5ff; }
    .c2-label { color: #ff9800; }
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      padding: 9px 20px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }
    .btn-auto { background: #4caf50; }
    .btn-reset { background: #f44336; }
    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 12px;
      margin-top: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <h2>पहाड़ी U-टर्न (Hairpin Bend) सिमुलेशन</h2>
  <p>नीचे दिए गए स्लाइडर्स से दोनों कार को खुद चलाकर टेस्ट करें</p>

  <canvas id="simCanvas" width="460" height="640"></canvas>

  <div class="controller-box">
    <!-- Manual Controller for Car A -->
    <div class="slider-row">
      <span class="c1-label">कार A (बाएं)</span>
      <input type="range" id="car1Slider" min="0" max="100" value="10" oninput="manualUpdate()">
      <span id="c1Val">10%</span>
    </div>

    <!-- Manual Controller for Car B -->
    <div class="slider-row">
      <span class="c2-label">कार B (दाएं)</span>
      <input type="range" id="car2Slider" min="0" max="100" value="10" oninput="manualUpdate()">
      <span id="c2Val">10%</span>
    </div>

    <div class="btn-row">
      <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">Auto Run</button>
      <button class="btn-reset" onclick="resetControls()">Reset</button>
    </div>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:#00e676;"></span>ग्रीन लाइट: रास्ता सुरक्षित</div>
    <div><span class="dot" style="background:#ff1744;"></span>रेड लाइट + हॉर्न: मोड पर खतरा</div>
  </div>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    const slider1 = document.getElementById("car1Slider");
    const slider2 = document.getElementById("car2Slider");
    const label1 = document.getElementById("c1Val");
    const label2 = document.getElementById("c2Val");
    const autoBtn = document.getElementById("autoBtn");

    let isAutoRunning = false;
    let autoInterval = null;

    // Road Dimensions & Lane Radii
    const centerX = 230;
    const centerY = 240;
    const roadWidth = 120; // Complete road width
    const outerRadius = 175;
    const innerRadius = 55;

    // Perfect Center of Lanes (Road ke theek beech mein chalne ke liye)
    const laneLeftRadius = 135;  // Inner lane center (Left side up, curve, exit)
    const laneRightRadius = 95;  // Outer/Inner reciprocal lane center

    // Web Audio Horn
    let audioCtx = null;
    let osc = null;
    let gainNode = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function soundAlert(play) {
      if (play) {
        if (!audioCtx) initAudio();
        if (!osc && audioCtx) {
          osc = audioCtx.createOscillator();
          gainNode = audioCtx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(750, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc.start();
        }
      } else {
        if (osc) {
          try { osc.stop(); osc.disconnect(); } catch(e){}
          osc = null;
        }
      }
    }

    // Exact Path Coordinate Calculation
    function getCarPosition(progressPercent, isLeftCar) {
      const p = progressPercent / 100;
      let x, y, angle;

      if (isLeftCar) {
        // Car A: Comes from bottom left (x=160), goes up, around bend, down right
        const r = 135; // Center of Left/Outer Lane
        const straightLen = 400; // Straight length (y: 640 to 240)
        const curveLen = Math.PI * r;
        const totalLen = (straightLen * 2) + curveLen;

        const currentDist = p * totalLen;

        if (currentDist <= straightLen) {
          // Bottom-left straight going UP
          x = centerX - r;
          y = 640 - currentDist;
          angle = -Math.PI / 2;
        } else if (currentDist <= straightLen + curveLen) {
          // Semi-circular bend at top
          const arcDist = currentDist - straightLen;
          const theta = Math.PI - (arcDist / r);
          x = centerX + r * Math.cos(theta);
          y = centerY - r * Math.sin(theta);
          angle = -theta + Math.PI;
        } else {
          // Right straight going DOWN
          const afterArc = currentDist - (straightLen + curveLen);
          x = centerX + r;
          y = centerY + afterArc;
          angle = Math.PI / 2;
        }
      } else {
        // Car B: Comes from bottom right (x=300), goes up, around inner bend, down left
        const r = 95; // Center of Right Lane
        const straightLen = 400;
        const curveLen = Math.PI * r;
        const totalLen = (straightLen * 2) + curveLen;

        const currentDist = p * totalLen;

        if (currentDist <= straightLen) {
          // Bottom-right straight going UP
          x = centerX + r;
          y = 640 - currentDist;
          angle = -Math.PI / 2;
        } else if (currentDist <= straightLen + curveLen) {
          // Semi-circular bend counter-clockwise
          const arcDist = currentDist - straightLen;
          const theta = arcDist / r;
          x = centerX + r * Math.cos(theta);
          y = centerY - r * Math.sin(theta);
          angle = -theta;
        } else {
          // Left straight going DOWN
          const afterArc = currentDist - (straightLen + curveLen);
          x = centerX - r;
          y = centerY + afterArc;
          angle = Math.PI / 2;
        }
      }
      return { x, y, angle };
    }

    // Traffic Signal Post Function
    function drawSignalLight(x, y, isRed) {
      // Stand
      ctx.fillStyle = "#222";
      ctx.fillRect(x - 3, y - 10, 6, 40);

      // Light Box
      ctx.fillStyle = "#111";
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - 14, y - 55, 28, 50, 6);
      ctx.fill();
      ctx.stroke();

      // RED Bulb
      ctx.beginPath();
      ctx.arc(x, y - 42, 8, 0, Math.PI * 2);
      ctx.fillStyle = isRed ? "#ff1744" : "#450000";
      if (isRed) {
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 15;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      // GREEN Bulb
      ctx.beginPath();
      ctx.arc(x, y - 20, 8, 0, Math.PI * 2);
      ctx.fillStyle = !isRed ? "#00e676" : "#003a15";
      if (!isRed) {
        ctx.shadowColor = "#00e676";
        ctx.shadowBlur = 12;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Mud / Mountain Background
      ctx.fillStyle = "#331a0e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Mountain slopes
      ctx.fillStyle = "#4a2815";
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(60, 0); ctx.lineTo(40, 240); ctx.lineTo(0, 500);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(460, 0); ctx.lineTo(400, 0); ctx.lineTo(420, 240); ctx.lineTo(460, 500);
      ctx.fill();

      // Middle Hill / Divider
      ctx.fillStyle = "#3d1f10";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerRadius, Math.PI, 0, false);
      ctx.lineTo(centerX + innerRadius, 640);
      ctx.lineTo(centerX - innerRadius, 640);
      ctx.closePath();
      ctx.fill();

      // 2. Main Pitch Black Road Surface
      ctx.fillStyle = "#1c1c1c";
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, Math.PI, 0, false);
      ctx.lineTo(centerX + outerRadius, 640);
      ctx.lineTo(centerX - outerRadius, 640);
      ctx.closePath();
      ctx.fill();

      // Cut out the inner hill to make accurate U-shape
      ctx.fillStyle = "#3d1f10";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerRadius, Math.PI, 0, false);
      ctx.lineTo(centerX + innerRadius, 640);
      ctx.lineTo(centerX - innerRadius, 640);
      ctx.closePath();
      ctx.fill();

      // 3. Black & White Zebra Border Striping
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, Math.PI, 0, false);
      ctx.lineTo(centerX + outerRadius, 640);
      ctx.moveTo(centerX - outerRadius, 240);
      ctx.lineTo(centerX - outerRadius, 640);
      ctx.stroke();

      ctx.strokeStyle = "#000000";
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerRadius + 2, Math.PI, 0, false);
      ctx.lineTo(centerX + innerRadius + 2, 640);
      ctx.moveTo(centerX - innerRadius - 2, 240);
      ctx.lineTo(centerX - innerRadius - 2, 640);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. Center Lane Dividing Dashed Line
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([16, 14]);
      const midRadius = (outerRadius + innerRadius) / 2; // 115
      ctx.beginPath();
      ctx.arc(centerX, centerY, midRadius, Math.PI, 0, false);
      ctx.moveTo(centerX - midRadius, 240);
      ctx.lineTo(centerX - midRadius, 640);
      ctx.moveTo(centerX + midRadius, 240);
      ctx.lineTo(centerX + midRadius, 640);
      ctx.stroke();
      ctx.setLineDash([]);

      // 5. Battery Packs representation at bottom-left
      for (let i = 0; i < 3; i++) {
        const bx = 78 + (i * 24), by = 550;
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(bx, by, 18, 30);
        ctx.fillStyle = "#eee";
        ctx.fillRect(bx + 2, by - 3, 4, 3);
        ctx.fillRect(bx + 11, by - 3, 4, 3);
        ctx.fillStyle = "#fff";
        ctx.font = "7px sans-serif";
        ctx.fillText("HYW", bx + 1, by + 14);
      }

      // Calculate Car Coordinates
      const pos1 = getCarPosition(slider1.value, true);
      const pos2 = getCarPosition(slider2.value, false);

      // Draw Car A (Cyan Blue)
      ctx.save();
      ctx.translate(pos1.x, pos1.y);
      ctx.rotate(pos1.angle);
      ctx.fillStyle = "#00bcd4";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#ffffff"; // Windshield
      ctx.fillRect(-8, -11, 16, 6);
      ctx.fillStyle = "#ffeb3b"; // Headlights
      ctx.fillRect(-8, -19, 4, 2);
      ctx.fillRect(4, -19, 4, 2);
      ctx.restore();

      // Draw Car B (Orange)
      ctx.save();
      ctx.translate(pos2.x, pos2.y);
      ctx.rotate(pos2.angle);
      ctx.fillStyle = "#ff9800";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-8, -11, 16, 6);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-8, -19, 4, 2);
      ctx.fillRect(4, -19, 4, 2);
      ctx.restore();

      // Danger Condition: Both cars approaching or present in the upper curve
      const p1 = Number(slider1.value);
      const p2 = Number(slider2.value);
      const isDanger = (p1 >= 35 && p1 <= 75) && (p2 >= 35 && p2 <= 75);

      // Play alert buzzer sound
      soundAlert(isDanger);

      // Draw Left and Right Side Signal Posts
      drawSignalLight(32, 260, isDanger);
      drawSignalLight(428, 260, isDanger);

      // Alert Warning text banner
      if (isDanger) {
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("🚨 RED ALERT: HORN ON! 🚨", centerX, 40);
      }
    }

    function manualUpdate() {
      label1.innerText = slider1.value + "%";
      label2.innerText = slider2.value + "%";
      render();
    }

    function toggleAuto() {
      initAudio();
      if (!isAutoRunning) {
        isAutoRunning = true;
        autoBtn.innerText = "Pause";
        autoBtn.style.background = "#ff9800";
        autoInterval = setInterval(() => {
          slider1.value = (Number(slider1.value) + 1) % 100;
          slider2.value = (Number(slider2.value) + 1) % 100;
          manualUpdate();
        }, 50);
      } else {
        isAutoRunning = false;
        autoBtn.innerText = "Auto Run";
        autoBtn.style.background = "#4caf50";
        clearInterval(autoInterval);
        soundAlert(false);
      }
    }

    function resetControls() {
      if (isAutoRunning) toggleAuto();
      slider1.value = 10;
      slider2.value = 10;
      manualUpdate();
      soundAlert(false);
    }

    // Initial load
    manualUpdate();
  </script>
</body>
</html>
