<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hilly U-Shape Road Accident Prevention System</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h2 {
      color: #ffeb3b;
      margin-bottom: 5px;
    }
    p {
      color: #ddd;
      font-size: 14px;
      margin-top: 0;
    }
    #simCanvas {
      background-color: #4CAF50;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      display: block;
      margin: 0 auto;
    }
    .controls {
      margin-top: 15px;
    }
    button {
      padding: 10px 22px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px 10px;
      color: white;
      transition: 0.2s;
    }
    .btn-run {
      background-color: #ff5722;
    }
    .btn-run:hover {
      background-color: #e64a19;
    }
    .btn-reset {
      background-color: #03a9f4;
    }
    .btn-reset:hover {
      background-color: #0288d1;
    }
    .legend {
      margin-top: 15px;
      font-size: 13px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .box {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <h2>पहाड़ी U-टर्न (Hairpin Bend) स्मार्ट अलर्ट सिमुलेशन</h2>
  <p>दोनों तरफ से आ रही गाड़ियों के लिए ऑटोमैटिक लाइट ब्लिंकर और हॉर्न अलार्म सिस्टम</p>

  <canvas id="simCanvas" width="600" height="420"></canvas>

  <div class="controls">
    <button class="btn-run" onclick="startSimulation()">Simulate Run</button>
    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="box" style="background:#2196F3;"></span> कार A (बाएं से)</div>
    <div class="legend-item"><span class="box" style="background:#FF9800;"></span> कार B (दाएं से)</div>
    <div class="legend-item"><span class="box" style="background:#f44336; border-radius:50%;"></span> अलर्ट लाइट / हॉर्न</div>
  </div>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    // Road curve parameters
    const centerX = 300;
    const centerY = 140;
    const radius = 170;
    const roadWidth = 56;

    let isRunning = false;
    let animId = null;
    let alertActive = false;

    // Angles for Car 1 (Left to Right) and Car 2 (Right to Left)
    let angleCar1 = Math.PI; // 180 deg (Left top)
    let angleCar2 = 0;       // 0 deg (Right top)
    const speed = 0.008;

    // Web Audio Context for Horn / Buzzer Sound
    let audioCtx = null;
    let osc = null;
    let gainNode = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function startHorn() {
      if (!audioCtx || osc) return;
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(650, audioCtx.currentTime); // Alert Horn Frequency

      // Beep pulse modulation
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
    }

    function stopHorn() {
      if (osc) {
        try {
          osc.stop();
          osc.disconnect();
        } catch(e) {}
        osc = null;
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Inner green hill
      ctx.fillStyle = "#388E3C";
      ctx.beginPath();
      ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
      ctx.fill();

      // Valley / Cliff bottom base
      ctx.fillStyle = "#E67E22";
      ctx.beginPath();
      ctx.arc(centerX, centerY + 80, 160, 0, Math.PI);
      ctx.fill();

      // Road Surface (Dark Grey)
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI);
      ctx.lineWidth = roadWidth;
      ctx.strokeStyle = "#555555";
      ctx.stroke();

      // Road Center Dividing Line (Dashed)
      ctx.beginPath();
      ctx.setLineDash([12, 10]);
      ctx.arc(centerX, centerY, radius, 0, Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // Calculate Car Positions along lanes
      // Lane 1: Inner lane (radius - 14)
      const car1R = radius - 14;
      const c1X = centerX + car1R * Math.cos(angleCar1);
      const c1Y = centerY + car1R * Math.sin(angleCar1);

      // Lane 2: Outer lane (radius + 14)
      const car2R = radius + 14;
      const c2X = centerX + car2R * Math.cos(angleCar2);
      const c2Y = centerY + car2R * Math.sin(angleCar2);

      // Draw Car A (Blue)
      ctx.save();
      ctx.translate(c1X, c1Y);
      ctx.rotate(angleCar1 + Math.PI / 2);
      ctx.fillStyle = "#2196F3";
      ctx.fillRect(-8, -14, 16, 28);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-6, 12, 4, 3);
      ctx.fillRect(2, 12, 4, 3);
      ctx.restore();

      // Draw Car B (Orange)
      ctx.save();
      ctx.translate(c2X, c2Y);
      ctx.rotate(angleCar2 - Math.PI / 2);
      ctx.fillStyle = "#FF9800";
      ctx.fillRect(-8, -14, 16, 28);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-6, 12, 4, 3);
      ctx.fillRect(2, 12, 4, 3);
      ctx.restore();

      // Check alert condition (dono curve me aamne-saamne approach kar rahe hain)
      const dist = Math.abs(angleCar1 - angleCar2);
      alertActive = (dist < 1.1 && angleCar1 < Math.PI - 0.2 && angleCar2 > 0.2);

      // Warning Light & Horn Post (Bend Center me)
      const poleX = centerX;
      const poleY = centerY + radius + 30;

      // Pole Base
      ctx.fillStyle = "#333";
      ctx.fillRect(poleX - 4, poleY, 8, 20);

      if (alertActive && isRunning) {
        // Blinking Red Light
        const blink = Math.floor(Date.now() / 150) % 2 === 0;
        ctx.fillStyle = blink ? "#FF0000" : "#550000";

        // Light Glow
        if (blink) {
          ctx.beginPath();
          ctx.arc(poleX, poleY, 26, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 0, 0, 0.35)";
          ctx.fill();

          // Sound trigger
          startHorn();
        } else {
          stopHorn();
        }

        // Light bulb
        ctx.beginPath();
        ctx.arc(poleX, poleY, 14, 0, Math.PI * 2);
        ctx.fillStyle = blink ? "#FF1744" : "#7f0000";
        ctx.fill();

        // Warning Text
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("⚠️ HORN ACTIVE: SLOW DOWN!", centerX, poleY + 40);
      } else {
        // Normal Green/Idle Light
        stopHorn();
        ctx.beginPath();
        ctx.arc(poleX, poleY, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#4CAF50";
        ctx.fill();
      }
    }

    function update() {
      if (!isRunning) return;

      // Car 1 moves forward (Clockwise: PI to ~0)
      if (angleCar1 > 0.3) {
        angleCar1 -= speed;
      }

      // Car 2 moves forward (Counter-Clockwise: 0 to ~PI)
      if (angleCar2 < Math.PI - 0.3) {
        angleCar2 += speed;
      }

      drawScene();
      animId = requestAnimationFrame(update);
    }

    function startSimulation() {
      initAudio();
      if (!isRunning) {
        isRunning = true;
        update();
      }
    }

    function resetSimulation() {
      isRunning = false;
      cancelAnimationFrame(animId);
      stopHorn();
      angleCar1 = Math.PI;
      angleCar2 = 0;
      alertActive = false;
      drawScene();
    }

    // Initial Render
    drawScene();
  </script>
</body>
</html>
