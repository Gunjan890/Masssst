<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pahadi Hairpin Bend - Dual Side Red & Green Lights</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h2 {
      color: #ffeb3b;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    p {
      color: #ccc;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #canvasContainer {
      position: relative;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 15px;
      overflow: hidden;
      border: 3px solid #333;
    }
    #simCanvas {
      background-color: #2e1a0c;
      display: block;
    }
    .controls {
      margin-top: 20px;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px 10px;
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn-run {
      background: linear-gradient(135deg, #ff5722, #e64a19);
    }
    .btn-run:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(255, 87, 34, 0.4);
    }
    .btn-reset {
      background: linear-gradient(135deg, #03a9f4, #0288d1);
    }
    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(3, 169, 244, 0.4);
    }
    .legend {
      margin-top: 20px;
      font-size: 13px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .box {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <h2>पहाड़ी U-टर्न (Hairpin Bend) स्मार्ट अलर्ट सिमुलेशन</h2>
  <p>दोनों साइड रोड पर रेड और ग्रीन सिग्नल लाइट्स + ऑटोमैटिक हॉर्न अलर्ट</p>

  <div id="canvasContainer">
    <canvas id="simCanvas" width="500" height="700"></canvas>
  </div>

  <div class="controls">
    <button class="btn-run" onclick="startSimulation()">Simulate Run</button>
    <button class="btn-reset" onclick="resetSimulation()">Reset</button>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="box" style="background:#00e676; border-radius:50%;"></span> ग्रीन लाइट: रास्ता साफ (Safe)</div>
    <div class="legend-item"><span class="box" style="background:#ff1744; border-radius:50%;"></span> रेड लाइट + हॉर्न: खतरा / गाड़ी सामने है</div>
  </div>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    let isRunning = false;
    let animId = null;
    let alertActive = false;

    let car1Progress = 0; 
    let car2Progress = 0; 
    const speed = 0.0035;

    // Web Audio Context for Horn Sound
    let audioCtx = null;
    let osc = null;
    let gainNode = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function startHorn() {
      if (!audioCtx || osc) return;
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
      gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
    }

    function stopHorn() {
      if (osc) {
        try {
          osc.stop();
          osc.disconnect();
        } catch(e) {}
        osc = null;
      }
    }

    function getRoadPath(progress, isLeftCar) {
      let x, y, angle;
      if (isLeftCar) {
        if (progress < 0.4) {
          const t = progress / 0.4;
          x = 160;
          y = 700 - (t * 430);
          angle = -Math.PI / 2;
        } else if (progress < 0.75) {
          const t = (progress - 0.4) / 0.35;
          const r = 90;
          const centerX = 250;
          const centerY = 270;
          const currAngle = Math.PI - (t * Math.PI);
          x = centerX + r * Math.cos(currAngle);
          y = centerY + r * Math.sin(currAngle);
          angle = currAngle - Math.PI / 2;
        } else {
          const t = (progress - 0.75) / 0.25;
          x = 340;
          y = 270 + (t * 430);
          angle = Math.PI / 2;
        }
      } else {
        if (progress < 0.4) {
          const t = progress / 0.4;
          x = 410;
          y = 700 - (t * 430);
          angle = -Math.PI / 2;
        } else if (progress < 0.75) {
          const t = (progress - 0.4) / 0.35;
          const r = 160;
          const centerX = 250;
          const centerY = 270;
          const currAngle = t * Math.PI;
          x = centerX + r * Math.cos(currAngle);
          y = centerY + r * Math.sin(currAngle);
          angle = currAngle + Math.PI / 2;
        } else {
          const t = (progress - 0.75) / 0.25;
          x = 90;
          y = 270 + (t * 430);
          angle = Math.PI / 2;
        }
      }
      return { x, y, angle };
    }

    // Function to draw Dual Light Post (Red + Green light setup)
    function drawDualLightPole(x, y, isRedActive, blinkState) {
      // Pole stand
      ctx.fillStyle = "#222";
      ctx.fillRect(x - 3, y, 6, 45);

      // Light housing box
      ctx.fillStyle = "#111";
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x - 14, y - 48, 28, 52, 6);
      ctx.fill();
      ctx.stroke();

      // Top Bulb: RED LIGHT
      ctx.beginPath();
      ctx.arc(x, y - 35, 8, 0, Math.PI * 2);
      if (isRedActive && blinkState) {
        ctx.fillStyle = "#ff1744"; // Glow Red
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 15;
      } else {
        ctx.fillStyle = "#4a0000"; // Off/Dim Red
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      // Bottom Bulb: GREEN LIGHT
      ctx.beginPath();
      ctx.arc(x, y - 12, 8, 0, Math.PI * 2);
      if (!isRedActive) {
        ctx.fillStyle = "#00e676"; // Bright Green
        ctx.shadowColor = "#00e676";
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = "#003311"; // Off/Dim Green
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawScene() {
      // Muddy ground
      ctx.fillStyle = "#3a200d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Hill shapes
      ctx.fillStyle = "#5c3317";
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(130, 0); ctx.lineTo(100, 300); ctx.lineTo(0, 550);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(500, 0); ctx.lineTo(370, 0); ctx.lineTo(400, 300); ctx.lineTo(500, 550);
      ctx.fill();

      // Middle Hill
      ctx.fillStyle = "#4a270f";
      ctx.beginPath();
      ctx.moveTo(215, 270);
      ctx.quadraticCurveTo(250, 160, 285, 270);
      ctx.lineTo(285, 600); ctx.lineTo(215, 600);
      ctx.closePath();
      ctx.fill();

      // Foliage/Bushes
      const foliage = [[30, 80], [90, 100], [250, 120], [430, 90], [470, 260], [80, 410], [420, 420]];
      foliage.forEach(pos => {
        ctx.fillStyle = "#1e4d2b";
        ctx.beginPath(); ctx.arc(pos[0], pos[1], 15, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ffd54f";
        ctx.beginPath(); ctx.arc(pos[0] + 5, pos[1] - 3, 7, 0, Math.PI*2); ctx.fill();
      });

      // Road Surface
      ctx.strokeStyle = "#1b1b1b";
      ctx.lineWidth = 100;
      ctx.beginPath();
      ctx.moveTo(90, 700); ctx.lineTo(90, 270);
      ctx.arc(250, 270, 160, Math.PI, 0, false);
      ctx.lineTo(410, 270); ctx.lineTo(410, 700);
      ctx.stroke();

      ctx.lineWidth = 60;
      ctx.beginPath();
      ctx.moveTo(160, 700); ctx.lineTo(160, 270);
      ctx.arc(250, 270, 90, Math.PI, 0, false);
      ctx.lineTo(340, 270); ctx.lineTo(340, 700);
      ctx.stroke();

      // Zebra Borders
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.arc(250, 270, 205, Math.PI, 0, false);
      ctx.stroke();

      ctx.strokeStyle = "#000000";
      ctx.beginPath();
      ctx.arc(250, 270, 52, Math.PI, 0, false);
      ctx.stroke();
      ctx.setLineDash([]);

      // Road Lane Dividing Lines
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([18, 18]);
      ctx.beginPath();
      ctx.moveTo(160, 700); ctx.lineTo(160, 270);
      ctx.arc(250, 270, 90, Math.PI, 0, false);
      ctx.lineTo(340, 270); ctx.lineTo(340, 700);
      ctx.stroke();
      ctx.setLineDash([]);

      // 9V Battery Packs on Bottom Left
      const batX = 110, batY = 600;
      for (let i = 0; i < 3; i++) {
        const offset = i * 28;
        ctx.fillStyle = "#37474f";
        ctx.fillRect(batX + offset, batY, 22, 38);
        ctx.fillStyle = "#eceff1";
        ctx.fillRect(batX + offset + 3, batY - 4, 6, 4);
        ctx.fillRect(batX + offset + 13, batY - 4, 6, 4);
        ctx.fillStyle = "#ffffff";
        ctx.font = "8px sans-serif";
        ctx.fillText("HYW", batX + offset + 2, batY + 16);
      }

      // Car Positions
      const carA = getRoadPath(car1Progress, true);
      const carB = getRoadPath(car2Progress, false);

      // Car A (Cyan/Blue)
      ctx.save();
      ctx.translate(carA.x, carA.y);
      ctx.rotate(carA.angle);
      ctx.fillStyle = "#00bcd4";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#fff";
      ctx.fillRect(-8, -12, 16, 6);
      ctx.restore();

      // Car B (Orange)
      ctx.save();
      ctx.translate(carB.x, carB.y);
      ctx.rotate(carB.angle);
      ctx.fillStyle = "#ff9800";
      ctx.fillRect(-10, -18, 20, 36);
      ctx.fillStyle = "#fff";
      ctx.fillRect(-8, -12, 16, 6);
      ctx.restore();

      // Alert Logic: Jab dono cars curve ke pass aati hain
      alertActive = (car1Progress > 0.28 && car1Progress < 0.8 && car2Progress > 0.28 && car2Progress < 0.8);
      const blink = Math.floor(Date.now() / 150) % 2 === 0;

      // Sound trigger
      if (alertActive && isRunning) {
        if (blink) startHorn();
        else stopHorn();
      } else {
        stopHorn();
      }

      // DONO SIDE LIGHTS:
      // Left Road Light Pole (X: 30, Y: 290)
      drawDualLightPole(35, 290, alertActive && isRunning, blink);

      // Right Road Light Pole (X: 465, Y: 290)
      drawDualLightPole(465, 290, alertActive && isRunning, blink);

      // Alert banner message
      if (alertActive && isRunning) {
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 15px 'Segoe UI'";
        ctx.fillText("🚨 RED LIGHT & HORN ON: STOP / SLOW DOWN! 🚨", 250, 50);
      }
    }

    function update() {
      if (!isRunning) return;

      if (car1Progress < 1.0) car1Progress += speed;
      else car1Progress = 0;

      if (car2Progress < 1.0) car2Progress += speed;
      else car2Progress = 0;

      drawScene();
      animId = requestAnimationFrame(update);
    }

    function startSimulation() {
      initAudio();
      if (!isRunning) {
        isRunning = true;
        update();
      }
    }

    function resetSimulation() {
      isRunning = false;
      cancelAnimationFrame(animId);
      stopHorn();
      car1Progress = 0;
      car2Progress = 0;
      alertActive = false;
      drawScene();
    }

    drawScene();
  </script>
</body>
</html>
